<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings | Airport Grande Luxury Lodge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
    .cta-primary { background: linear-gradient(135deg, #d97706, #b45309); }
    .cta-primary:hover { background: linear-gradient(135deg, #b45309, #92400e); }
    .booking-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .booking-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.12); }
    .status-confirmed  { background: #d1fae5; color: #065f46; }
    .status-pending    { background: #fef3c7; color: #92400e; }
    .status-cancelled  { background: #fee2e2; color: #991b1b; }
    .status-completed  { background: #e0e7ff; color: #3730a3; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- NAVBAR -->
  <nav class="bg-white/90 backdrop-blur-xl border-b border-gray-100 shadow-sm fixed top-0 w-full z-50">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-20">
      <a href="index.html" class="text-2xl font-bold text-amber-700" style="font-family:'Playfair Display',serif;">Airport Grande</a>
      <div class="flex items-center gap-5">
        <a href="client-booking.html"
          class="hidden sm:flex items-center gap-2 cta-primary text-white text-sm font-semibold px-5 py-2.5 rounded-2xl transition-all hover:scale-[1.02]">
          <i data-lucide="plus" class="w-4 h-4"></i> New Booking
        </a>
        <button onclick="handleLogout()"
          class="text-sm text-gray-500 hover:text-red-500 flex items-center gap-1.5 transition-colors">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Sign Out</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="pt-28 pb-20 px-4 max-w-5xl mx-auto">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-10">
      <div>
        <p class="text-sm font-medium text-amber-600 mb-1">Welcome back</p>
        <h1 class="text-4xl font-bold text-gray-900" id="guest-name">Kwame Mensah</h1>
        <p class="text-gray-500 mt-1">Here are all your bookings at Airport Grande.</p>
      </div>
      <a href="client-booking.html"
        class="sm:hidden cta-primary inline-flex items-center gap-2 text-white font-semibold px-6 py-3 rounded-2xl text-sm">
        <i data-lucide="plus" class="w-4 h-4"></i> New Booking
      </a>
    </div>

    <!-- Stats strip -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Total Stays</p>
        <p class="text-3xl font-bold text-gray-900" id="stat-total">3</p>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <p class="text-xs font-semibold text-amber-600 uppercase tracking-wide mb-1">Upcoming</p>
        <p class="text-3xl font-bold text-gray-900" id="stat-upcoming">1</p>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <p class="text-xs font-semibold text-green-600 uppercase tracking-wide mb-1">Confirmed</p>
        <p class="text-3xl font-bold text-gray-900" id="stat-confirmed">2</p>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <p class="text-xs font-semibold text-indigo-600 uppercase tracking-wide mb-1">Completed</p>
        <p class="text-3xl font-bold text-gray-900" id="stat-completed">1</p>
      </div>
    </div>

    <!-- Filter tabs -->
    <div class="flex gap-2 mb-6 overflow-x-auto pb-1" id="filter-tabs">
      <button onclick="filterBookings('all', this)"
        class="filter-btn active-filter px-5 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap bg-amber-600 text-white transition-all">
        All Bookings
      </button>
      <button onclick="filterBookings('confirmed', this)"
        class="filter-btn px-5 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap bg-white border border-gray-200 text-gray-600 hover:border-amber-400 transition-all">
        Confirmed
      </button>
      <button onclick="filterBookings('pending', this)"
        class="filter-btn px-5 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap bg-white border border-gray-200 text-gray-600 hover:border-amber-400 transition-all">
        Pending
      </button>
      <button onclick="filterBookings('completed', this)"
        class="filter-btn px-5 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap bg-white border border-gray-200 text-gray-600 hover:border-amber-400 transition-all">
        Completed
      </button>
      <button onclick="filterBookings('cancelled', this)"
        class="filter-btn px-5 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap bg-white border border-gray-200 text-gray-600 hover:border-amber-400 transition-all">
        Cancelled
      </button>
    </div>

    <!-- Bookings list -->
    <div id="bookings-list" class="space-y-4"></div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-16">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gray-100 mb-5">
        <i data-lucide="calendar-x" class="w-8 h-8 text-gray-400"></i>
      </div>
      <h3 class="text-xl font-bold text-gray-700 mb-2">No bookings found</h3>
      <p class="text-gray-400 mb-6">You don't have any bookings in this category yet.</p>
      <a href="client-booking.html"
        class="cta-primary inline-flex items-center gap-2 text-white font-semibold px-8 py-4 rounded-3xl text-base transition-all hover:scale-[1.02]">
        Make a Booking <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </a>
    </div>

  </main>

  <script>
    lucide.createIcons();

    // Auth guard
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');
    const user = userStr ? JSON.parse(userStr) : null;

    if (!token || !user) {
      window.location.href = 'login.html';
    } else {
      document.getElementById('guest-name').textContent = user.name;
    }

    const API_BASE = '/api';
    let BOOKINGS = [];

    async function fetchMyBookings() {
      try {
        const res = await fetch(`${API_BASE}/bookings/my`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401 || res.status === 403) {
          handleLogout();
          return;
        }
        BOOKINGS = await res.json();
        updateStats();
        renderBookings('all');
      } catch (err) {
        console.error('Error fetching bookings:', err);
      }
    }

    function updateStats() {
      const counts = { confirmed: 0, pending: 0, completed: 0, upcoming: 0 };
      BOOKINGS.forEach(b => {
        counts[b.status] = (counts[b.status] || 0) + 1;
        if (b.status === 'confirmed' || b.status === 'pending') {
          counts.upcoming++;
        }
      });
      document.getElementById('stat-total').textContent = BOOKINGS.length;
      document.getElementById('stat-upcoming').textContent = counts.upcoming;
      document.getElementById('stat-confirmed').textContent = counts.confirmed;
      document.getElementById('stat-completed').textContent = counts.completed;
    }

    function renderBookings(filter) {
      const list = document.getElementById('bookings-list');
      const empty = document.getElementById('empty-state');
      const filtered = filter === 'all' ? BOOKINGS : BOOKINGS.filter(b => b.status === filter);

      if (filtered.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      list.innerHTML = filtered.map(b => {
        const statusMap = {
          confirmed: { label: 'Confirmed', cls: 'status-confirmed' },
          pending:   { label: 'Pending',   cls: 'status-pending' },
          completed: { label: 'Completed', cls: 'status-completed' },
          cancelled: { label: 'Cancelled', cls: 'status-cancelled' },
        };
        const s = statusMap[b.status] || statusMap.pending;
        const checkInFmt  = new Date(b.check_in).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
        const checkOutFmt = new Date(b.check_out).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });

        return `
        <div class="booking-card bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col sm:flex-row sm:items-center gap-5">
          <div class="flex-shrink-0 w-14 h-14 rounded-2xl bg-amber-50 flex items-center justify-center">
            <i data-lucide="${b.room_type.includes('Apartment') ? 'building-2' : 'bed-double'}" class="w-7 h-7 text-amber-600"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-start gap-2 mb-1">
              <h3 class="text-lg font-bold text-gray-900">${b.room_name}</h3>
              <span class="text-xs font-semibold px-3 py-1 rounded-full ${s.cls}">${s.label}</span>
            </div>
            <p class="text-sm text-gray-500 mb-3">${b.room_type}</p>
            <div class="flex flex-wrap gap-4 text-sm text-gray-600">
              <span class="flex items-center gap-1.5">
                <i data-lucide="calendar" class="w-4 h-4 text-amber-500"></i>
                ${checkInFmt} → ${checkOutFmt}
              </span>
            </div>
          </div>
          <div class="flex flex-col items-start sm:items-end gap-3 flex-shrink-0">
            <p class="text-xs text-gray-400 font-mono">Booking #${b.id}</p>
            <div class="flex gap-2">
              <button onclick="handleViewDetails('${b.id}')"
                class="text-xs font-semibold text-amber-700 hover:text-amber-900 px-3 py-1.5 rounded-xl border border-amber-200 hover:border-amber-400 transition-colors">
                Details
              </button>
            </div>
          </div>
        </div>`;
      }).join('');

      lucide.createIcons();
    }

    function filterBookings(filter, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-amber-600', 'text-white');
        b.classList.add('bg-white', 'border', 'border-gray-200', 'text-gray-600');
      });
      btn.classList.add('bg-amber-600', 'text-white');
      btn.classList.remove('bg-white', 'border', 'border-gray-200', 'text-gray-600');
      renderBookings(filter);
    }

    function handleViewDetails(id) {
      const b = BOOKINGS.find(x => x.id == id);
      if (!b) return;
      alert(`Booking Details:\nRoom: ${b.room_name}\nDates: ${b.check_in} to ${b.check_out}\nStatus: ${b.status}\nRequests: ${b.special_requests || 'None'}`);
    }

    function handleLogout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      sessionStorage.removeItem('adminAuth');
      window.location.href = 'login.html';
    }

    // Initial load
    fetchMyBookings();
  </script>
</body>
</html>
