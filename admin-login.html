<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Airport Grande Luxury Lodge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
    .cta-primary { background: linear-gradient(135deg, #d97706, #b45309); }
    .cta-primary:hover { background: linear-gradient(135deg, #b45309, #92400e); }
    .input-field {
      width: 100%; padding: 1rem 1.25rem; border-radius: 1rem;
      border: 1px solid #e5e7eb; font-size: 1rem; transition: border-color 0.2s;
    }
    .input-field:focus { outline: none; border-color: #f59e0b; }
    .input-wrapper { position: relative; }
    .input-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #9ca3af; pointer-events: none; }
    .input-field.has-icon { padding-left: 2.75rem; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- NAVBAR -->
  <nav class="bg-white/90 backdrop-blur-xl border-b border-gray-100 shadow-sm fixed top-0 w-full z-50">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-20">
      <a href="index.html" class="text-2xl font-bold text-amber-700" style="font-family:'Playfair Display',serif;">Airport Grande</a>
      <a href="index.html" class="text-sm text-gray-600 hover:text-amber-600 flex items-center gap-2 transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
      </a>
    </div>
  </nav>

  <main class="pt-28 pb-20 px-4 max-w-md mx-auto">
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gray-900 mb-5">
        <i data-lucide="shield" class="w-7 h-7 text-amber-400"></i>
      </div>
      <h1 class="text-4xl font-bold text-gray-900">Admin Portal</h1>
      <p class="text-gray-500 mt-3">Authorised staff access only.</p>
    </div>

    <div class="bg-white rounded-3xl shadow-xl p-8 md:p-10">

      <!-- Admin badge -->
      <div class="flex items-center gap-3 bg-gray-50 rounded-2xl px-4 py-3 mb-7 border border-gray-200">
        <i data-lucide="shield-check" class="w-5 h-5 text-amber-600 flex-shrink-0"></i>
        <p class="text-sm text-gray-600">This portal is for <strong>Airport Grande management</strong> only. Guests should use the <a href="login.html" class="text-amber-600 hover:underline">guest login</a>.</p>
      </div>

      <form id="admin-login-form" class="space-y-5" onsubmit="handleAdminLogin(event)">

        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Admin Email *</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon w-4 h-4"></i>
            <input type="email" id="adminEmail" required placeholder="admin@airportgrande.com"
              class="input-field has-icon">
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Password *</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon w-4 h-4"></i>
            <input type="password" id="adminPassword" required placeholder="Admin password"
              class="input-field has-icon" style="padding-right:3rem;">
            <button type="button" onclick="togglePassword('adminPassword', this)"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-amber-600 transition-colors">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Status Message -->
        <div id="admin-login-status" class="hidden rounded-2xl px-5 py-4 text-sm font-medium"></div>

        <!-- Submit -->
        <button type="submit" id="admin-login-btn"
          class="w-full text-white font-semibold py-4 rounded-3xl text-base transition-all hover:scale-[1.02] flex items-center justify-center gap-3 mt-2"
          style="background: linear-gradient(135deg, #111827, #374151);">
          <span id="admin-login-btn-text">ACCESS DASHBOARD</span>
          <i data-lucide="arrow-right" class="w-5 h-5" id="admin-login-btn-icon"></i>
          <svg id="admin-login-spinner" class="hidden animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="white" stroke-width="4"/>
            <path class="opacity-75" fill="white" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
        </button>

      </form>
    </div>
  </main>

  <script>
    lucide.createIcons();

    function togglePassword(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const isPassword = field.type === 'password';
      field.type = isPassword ? 'text' : 'password';
      btn.innerHTML = isPassword
        ? '<i data-lucide="eye-off" class="w-4 h-4"></i>'
        : '<i data-lucide="eye" class="w-4 h-4"></i>';
      lucide.createIcons();
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email    = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      setLoading(true);
      hideStatus();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        
        if (data.success) {
          if (data.user.role !== 'admin') {
            showStatus('Access denied. This portal is for administrators only.', 'error');
            return;
          }
          
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          sessionStorage.setItem('adminAuth', '1');
          
          showStatus('Access granted. Redirecting…', 'success');
          setTimeout(() => window.location.href = 'admin-dashboard.html', 1200);
        } else {
          showStatus(data.message, 'error');
        }
      } catch (err) {
        showStatus('Could not connect to authentication server. Please try again later.', 'error');
      } finally {
        setLoading(false);
      }
    }

    function setLoading(loading) {
      document.getElementById('admin-login-btn').disabled = loading;
      document.getElementById('admin-login-btn-text').textContent = loading ? 'Authenticating…' : 'ACCESS DASHBOARD';
      document.getElementById('admin-login-btn-icon').classList.toggle('hidden', loading);
      document.getElementById('admin-login-spinner').classList.toggle('hidden', !loading);
    }

    function showStatus(msg, type) {
      const el = document.getElementById('admin-login-status');
      el.textContent = msg;
      el.className = `rounded-2xl px-5 py-4 text-sm font-medium ${
        type === 'success'
          ? 'bg-green-50 text-green-700 border border-green-200'
          : 'bg-red-50 text-red-700 border border-red-200'
      }`;
      el.classList.remove('hidden');
    }

    function hideStatus() {
      document.getElementById('admin-login-status').classList.add('hidden');
    }
  </script>
</body>
</html>
